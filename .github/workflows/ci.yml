name: CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        working-directory: springboot-demo # 若仓库根就是项目，删掉这行
        run: ./mvnw -B test -Dtest=UserControllerTest

  build-image:
    runs-on: ubuntu-latest
    needs: test # 依赖 test 任务,测试通过才构建
    permissions:
      contents: read
      packages: write   # 推 GHCR 必须

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io  # 使用 GitHub Container Registry，GitHub 容器仓库
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # type=gha 缓存需要 docker-container 驱动，不能用默认 docker 驱动
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: springboot-demo          # Dockerfile 所在目录
          file: springboot-demo/Dockerfile  # 可省略，默认找 context 下 Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max       # 缓存到 GitHub Actions 缓存
          tags: |
            ghcr.io/${{ github.repository_owner }}/study/springboot-demo:latest
            ghcr.io/${{ github.repository_owner }}/study/springboot-demo:sha-${{ github.sha }}
